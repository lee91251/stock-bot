name: 투자 비서 v6.0 — AI 강화판

on:
  # 정시 트리거는 cron-job.org가 담당 (KST 기준 정확한 시간 보장).
  # GitHub Actions schedule은 무료 cron의 5분~수시간 지연 문제로 2026-04-29 제거.
  # 외부 트리거는 workflow_dispatch (POST)로 호출 — cron-job.org 6개 Job이 mode별로 호출.
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: false
        default: "daily"
        type: choice
        options:
          - "daily"
          - "--usclose"
          - "--premarket"
          - "--close"
          - "--monitor"
          - "--marketscan"
          - "--autobuy"
          - "--autosell"
          - "--ccstrlog"
          - "--balance"
          - "--backtest"
          - "--backtest12"
          - "--backtest4track"

permissions:
  contents: write   # 대시보드/캐시/포지션 자동 푸시용

env:
  TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
  DART_API_KEY:         ${{ secrets.DART_API_KEY }}
  KIS_APP_KEY:          ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET:       ${{ secrets.KIS_APP_SECRET }}
  ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
  HOLDINGS_JSON:        ${{ secrets.HOLDINGS_JSON }}
  # ── 자동매매 (스윙 모의투자) ──
  PAPER_TRADING:        "true"   # ⚠️ 실전 전환 시 false로 (별도 KIS_REAL_ACCOUNT 필요)
  AUTO_TRADE_ENABLED:   "true"   # 일시 차단 시 false
  KIS_PAPER_APP_KEY:    ${{ secrets.KIS_PAPER_APP_KEY }}
  KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
  KIS_PAPER_ACCOUNT:    ${{ secrets.KIS_PAPER_ACCOUNT }}

jobs:
  # ── 일일 AI 리포트 (cron-job.org 평일 08:00 KST) ────
  daily-report:
    if: github.event.inputs.mode == 'daily' || github.event.inputs.mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: AI 분석 및 텔레그램 전송
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "daily" ] || [ -z "$MODE" ]; then
            python stock.py
          else
            python stock.py "$MODE"
          fi
      - name: 성과 기록 + 대시보드 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add performance.json docs/ dashboard_cache.json portfolio_history.json dart_seen.json || true
          git diff --staged --quiet || git commit -m "chore: 일일 리포트 + 대시보드 $(date '+%Y-%m-%d')"
          git push || true

  # ── 미국 시장 마감 브리핑 (cron-job.org 평일 06:00 KST) ────
  us-briefing:
    if: github.event.inputs.mode == '--usclose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 자동매매 관련 워크플로우 sequential 실행 (race condition 차단)
    concurrency:
      group: trading-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 미국 마감 브리핑
        run: python stock.py --usclose
      - name: 대시보드 + tomorrow_picks + alerts 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 파일 존재 체크 후 개별 add (한 파일 없어도 fatal 방지)
          [ -d docs ] && git add docs/ || true
          [ -f tomorrow_picks.json ] && git add tomorrow_picks.json || true
          [ -f alerts.json ] && git add alerts.json || true
          [ -f ai_advisor_log.json ] && git add ai_advisor_log.json || true
          [ -f mirae_paper.json ] && git add mirae_paper.json || true
          echo "=== git status (디버그) ==="
          git status --short
          git diff --staged --quiet && echo "변경 없음 — commit 스킵" && exit 0 || true
          git commit -m "chore: 대시보드 + alerts (미국 마감) $(date '+%Y-%m-%d')"
          # push retry — 충돌 시 pull --rebase 후 재시도
          git push 2>&1 || (
            echo "push 충돌 — rebase 후 재시도"
            git pull --rebase --autostash -X ours origin master 2>&1
            git push 2>&1 || (
              sleep 3
              git pull --rebase --autostash -X ours origin master 2>&1
              git push 2>&1
            )
          )

  # ── 장 시작 전 브리핑 (cron-job.org 평일 08:50 KST) ────
  premarket-briefing:
    if: github.event.inputs.mode == '--premarket'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trading-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 장전 브리핑
        run: python stock.py --premarket
      - name: 대시보드 + mirae_paper + alerts 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d docs ] && git add docs/ || true
          [ -f mirae_paper.json ] && git add mirae_paper.json || true
          [ -f alerts.json ] && git add alerts.json || true
          [ -f ai_advisor_log.json ] && git add ai_advisor_log.json || true
          [ -f tomorrow_picks.json ] && git add tomorrow_picks.json || true
          echo "=== git status (디버그) ==="
          git status --short
          git diff --staged --quiet && echo "변경 없음 — commit 스킵" && exit 0 || true
          git commit -m "chore: 대시보드 + alerts (장 시작 전) $(date '+%Y-%m-%d %H:%M')"
          git push 2>&1 || (
            echo "push 충돌 — rebase 후 재시도"
            git pull --rebase --autostash -X ours origin master 2>&1
            git push 2>&1 || (
              sleep 3
              git pull --rebase --autostash -X ours origin master 2>&1
              git push 2>&1
            )
          )

  # ── 장 마감 결산 (cron-job.org 평일 15:35 KST) ────
  close-summary:
    if: github.event.inputs.mode == '--close'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trading-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 마감 결산
        run: python stock.py --close
      - name: 대시보드 + tomorrow_picks + mirae_paper + alerts 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d docs ] && git add docs/ || true
          [ -f tomorrow_picks.json ] && git add tomorrow_picks.json || true
          [ -f mirae_paper.json ] && git add mirae_paper.json || true
          [ -f alerts.json ] && git add alerts.json || true
          [ -f ai_advisor_log.json ] && git add ai_advisor_log.json || true
          echo "=== git status (디버그) ==="
          git status --short
          git diff --staged --quiet && echo "변경 없음 — commit 스킵" && exit 0 || true
          git commit -m "chore: 대시보드 + alerts (장 마감) $(date '+%Y-%m-%d')"
          git push 2>&1 || (
            echo "push 충돌 — rebase 후 재시도"
            git pull --rebase --autostash -X ours origin master 2>&1
            git push 2>&1 || (
              sleep 3
              git pull --rebase --autostash -X ours origin master 2>&1
              git push 2>&1
            )
          )

  # ── 장중 실시간 모니터링 (cron-job.org 평일 09:05 KST 시작, 20분) ────
  intraday-monitor:
    if: github.event.inputs.mode == '--monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 장중 모니터링 (20분)
        run: python -c "import stock; stock.run_monitor(duration_hours=0.33, interval_sec=120)"

  # ── 자동 매수 (cron-job.org 평일 09:00~15:30, 15분마다) ────
  auto-buy:
    if: github.event.inputs.mode == '--autobuy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CRITICAL: race condition 영구 차단 — autobuy/autosell sequential 실행
    # 한 회차 끝(push 완료)나야 다음 회차 시작 → 같은 종목 중복 매수 불가능
    concurrency:
      group: trading-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 자동 매수 (스윙)
        run: python stock.py --autobuy
      - name: 포지션 + 대시보드 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f positions.json ] && git add positions.json || true
          [ -f verify_log.json ] && git add verify_log.json || true
          [ -d docs ] && git add docs/ || true
          [ -f alerts.json ] && git add alerts.json || true
          [ -f ai_advisor_log.json ] && git add ai_advisor_log.json || true
          [ -f tomorrow_picks.json ] && git add tomorrow_picks.json || true
          [ -f mirae_paper.json ] && git add mirae_paper.json || true
          echo "=== git status (디버그) ==="
          git status --short
          git diff --staged --quiet && echo "변경 없음 — commit 스킵" && exit 0 || true
          git commit -m "chore: 자동매수 포지션 + 대시보드 + alerts $(date '+%Y-%m-%d %H:%M')"
          # push retry — 충돌 시 pull --rebase 후 다시 push (race condition 방어)
          git push 2>&1 || (
            echo "push 충돌 — rebase 후 재시도"
            git pull --rebase --autostash -X ours origin master 2>&1
            git push 2>&1 || (
              sleep 3
              git pull --rebase --autostash -X ours origin master 2>&1
              git push 2>&1
            )
          )

  # ── 자동 매도 (cron-job.org 평일 09:00~15:30, 15분마다) ────
  auto-sell:
    if: github.event.inputs.mode == '--autosell'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CRITICAL: race condition 영구 차단 — autobuy와 같은 그룹
    concurrency:
      group: trading-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 자동 매도 (조건 점검)
        run: python stock.py --autosell
      - name: 포지션 + 대시보드 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f positions.json ] && git add positions.json || true
          [ -f verify_log.json ] && git add verify_log.json || true
          [ -d docs ] && git add docs/ || true
          [ -f dart_seen.json ] && git add dart_seen.json || true
          [ -f alerts.json ] && git add alerts.json || true
          [ -f ai_advisor_log.json ] && git add ai_advisor_log.json || true
          [ -f tomorrow_picks.json ] && git add tomorrow_picks.json || true
          [ -f mirae_paper.json ] && git add mirae_paper.json || true
          echo "=== git status (디버그) ==="
          git status --short
          git diff --staged --quiet && echo "변경 없음 — commit 스킵" && exit 0 || true
          git commit -m "chore: 자동매도 포지션 + 대시보드 + alerts $(date '+%Y-%m-%d %H:%M')"
          git push 2>&1 || (
            echo "push 충돌 — rebase 후 재시도"
            git pull --rebase --autostash -X ours origin master 2>&1
            git push 2>&1 || (
              sleep 3
              git pull --rebase --autostash -X ours origin master 2>&1
              git push 2>&1
            )
          )

  # ── 체결강도 로거 (cron-job.org 평일 09:00~15:30, 5분마다) ────
  balance-check:
    if: github.event.inputs.mode == '--balance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 잔고 조회 테스트
        run: python stock.py --balance

  ccstr-log:
    if: github.event.inputs.mode == '--ccstrlog'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 체결강도 스냅샷 로깅
        run: python stock.py --ccstrlog
      - name: 로그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f ccstr_log.json ] && git add ccstr_log.json || true
          git diff --staged --quiet && echo "변경 없음 — commit 스킵" && exit 0 || true
          git commit -m "chore: 체결강도 로그 $(date '+%Y-%m-%d %H:%M')"
          git push 2>&1 || (
            git pull --rebase --autostash -X ours origin master 2>&1
            git push 2>&1
          )

  # ── 백테스팅 (수동 / 주말 자동) ────
  backtest:
    if: github.event.inputs.mode == '--backtest' || github.event.inputs.mode == '--backtest12'
    runs-on: ubuntu-latest
    # Multi-env Grid Search (54조합 시뮬 ≈ 4~5h) 위해 60분 → 360분
    # 5/12 회장 결정 (B → 부재 → C Walk-forward 전략)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 백테스팅 실행
        run: |
          MONTHS=6
          if [ "${{ github.event.inputs.mode }}" = "--backtest12" ]; then
            MONTHS=12
          fi
          python backtest.py "$MONTHS"
      - name: 결과 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results.json || true
          git diff --staged --quiet || git commit -m "chore: 백테스팅 결과 업데이트 $(date '+%Y-%m-%d')"
          git push || true

  # ── 5/14: 4트랙 백테스트 (스윙·단기·중기·장기 일괄 검증) ────
  backtest-4track:
    if: github.event.inputs.mode == '--backtest4track'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 4트랙 백테스트 실행
        run: python backtest.py --4track
      - name: 결과 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results.json || true
          git diff --staged --quiet || git commit -m "chore: 4트랙 백테스트 결과 $(date '+%Y-%m-%d')"
          git push || true

  # ── 코스피/코스닥 전체 스캔 (cron-job.org 평일 02:00 KST) ────
  market-scan:
    if: github.event.inputs.mode == '--marketscan'
    runs-on: ubuntu-latest
    timeout-minutes: 35  # 5/29: 120→20→35분 (20분 부족 — DART셋업 5분 + 1500종목 분석 25분 + 여유 5분)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 시장 전체 스캔
        run: python -u stock.py --marketscan  # 5/29: -u unbuffered (진행 중 stdout 즉시)
      - name: 스캔 결과 + 대시보드 커밋
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          bash .github/scripts/encrypt_dashboard.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_scan_cache.json docs/ || true
          [ -f market_breadth_history.json ] && git add market_breadth_history.json || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: 시장 스캔 + 대시보드 $(date '+%Y-%m-%d')"
          # 5/15 fix: git push retry (5/6 메모리 영구 차단 적용 — marketscan에 누락됐던 부분)
          for i in 1 2 3; do
            if git push; then
              echo "Push 성공 (시도 $i)"; exit 0
            fi
            echo "Push 실패 (시도 $i) — pull --rebase 후 재시도"
            git pull --rebase origin master || true
            sleep 3
          done
          echo "::warning::Git push 3회 모두 실패 — 다음 marketscan 호출에서 재시도됨"
