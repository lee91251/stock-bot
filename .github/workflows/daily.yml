name: 매일 아침 7시 투자 비서 (AI 강화판)

on:
  schedule:
    # 평일 오전 7시 KST = UTC 22:30 (전날)
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: AI 분석 및 텔레그램 전송
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY:       ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:    ${{ secrets.KIS_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOLDINGS_JSON:     ${{ secrets.HOLDINGS_JSON }}
        run: python stock.py
      - name: 성과 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add performance.json || true
          git diff --staged --quiet || git commit -m "chore: 일일 성과 기록 업데이트 $(date '+%Y-%m-%d')"
          git push || true
