            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #03060f;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #03060f;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #0a0e1a;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;

<style id="jarvis-login-style">
:root {
  --jv-cyan:   #06b6d4;
  --jv-cyan-2: #0891b2;
  --jv-blue:   #3b82f6;

}
* { box-sizing: border-box; }
html, body, html.staticrypt-html, body.staticrypt-body, html[class], body[class] {
  margin: 0 !important; padding: 0 !important;
  height: 100% !important; width: 100% !important;
  background: #03060f !important;
  background-color: #03060f !important;

  color: #fff !important;
  overflow-x: hidden;
}
.staticrypt-html, .staticrypt-body {

  background-color: #03060f !important;
  background-image: none !important;
  min-height: 100vh;
  color: #fff;
  position: relative;
  overflow-x: hidden;
}

/* ── 페이지 레이아웃 (모든 기기) ── */
.staticrypt-page {
  position: relative; z-index: 1;
  display: flex !important; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
  background: transparent !important;
}

/* ── 카드 베이스 (모든 기기) — 폰에선 단색 반투명, PC에선 아래 @media에서 blur ── */
.staticrypt-form {
  position: relative;
  width: 100%; max-width: 420px;
  background: rgba(8, 12, 22, 0.95) !important;
  border: 1px solid rgba(6,182,212,0.30) !important;
  border-radius: 18px !important;
  padding: 44px 40px !important;
  box-shadow:
    0 0 0 1px rgba(6,182,212,0.15),
    0 25px 50px -12px rgba(0,0,0,0.8) !important;
  overflow: hidden;
}

/* 카드 모서리 cyan 코너 액센트 — 좌상단 ㄱ + 우하단 ㄴ (대칭, 가벼움 — 모든 기기) */
.staticrypt-form::before {
  content: ""; position: absolute; top: 12px; left: 12px;
  width: 28px; height: 28px;
  border-top: 2px solid var(--jv-cyan);
  border-left: 2px solid var(--jv-cyan);
  opacity: 0.85;
  pointer-events: none;
}
.staticrypt-form::after {
  content: ""; position: absolute; bottom: 12px; right: 12px;
  width: 28px; height: 28px;
  border-bottom: 2px solid var(--jv-cyan);
  border-right: 2px solid var(--jv-cyan);
  opacity: 0.85;
  pointer-events: none;
}

/* 카드 콘텐츠 z-index — 스캔 라인 위에 (PC) / 그냥 정렬용 (폰) */
.staticrypt-title,
.staticrypt-instructions,
.staticrypt-hr,
.staticrypt-password-container,
.staticrypt-remember,
.staticrypt-decrypt-button,
#staticrypt_content,
#staticrypt-form {
  position: relative;
  z-index: 2;
}

/* ── 타이틀 (cyan 글로우) ── */
.staticrypt-title {
  color: #fff !important;
  font-size: 26px !important; font-weight: 800 !important;
  letter-spacing: 0px;
  text-align: center;
  margin: 0 0 14px !important;
  background: linear-gradient(135deg, #fff 0%, #67e8f9 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 30px rgba(6,182,212,0.4);
}
.staticrypt-instructions {
  color: rgba(186,230,253,0.65) !important;
  font-size: 13px !important; line-height: 1.6;
  text-align: center;
  margin: 0 0 28px !important;
  letter-spacing: 0.2px;
}
.staticrypt-hr {
  border: none !important;
  border-top: 1px solid rgba(6,182,212,0.15) !important;
  margin: 0 0 22px !important;
}

/* ── 입력창 ── */
.staticrypt-password-container { position: relative; margin-bottom: 18px !important; }
#staticrypt-password {
  background: rgba(255,255,255,0.95) !important;
  border: 1.5px solid rgba(6,182,212,0.40) !important;
  border-radius: 10px !important;
  padding: 14px 48px 14px 18px !important;
  color: #0f172a !important;
  font-size: 16px !important;
  font-weight: 700 !important;
  letter-spacing: 1.5px !important;
  width: 100%;
  outline: none !important;
  caret-color: var(--jv-cyan) !important;
  transition: all 0.2s ease;
  -webkit-text-fill-color: #0f172a !important;
  box-shadow: 0 2px 12px rgba(6,182,212,0.10) !important;
}
#staticrypt-password::placeholder {
  color: rgba(15,23,42,0.45) !important;
  font-weight: 500 !important;
  letter-spacing: 0 !important;
  -webkit-text-fill-color: rgba(15,23,42,0.45) !important;
}
#staticrypt-password:focus {
  border-color: var(--jv-cyan) !important;
  background: #ffffff !important;
  box-shadow: 0 0 0 3px rgba(6,182,212,0.25),
              0 0 25px rgba(6,182,212,0.30) !important;
}
.hidden { display: none !important; }
#staticrypt-form, #staticrypt_content { pointer-events: auto !important; }
.staticrypt-toggle-password-visibility {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: transparent !important; border: none; cursor: pointer;
  color: rgba(186,230,253,0.5) !important;
  padding: 6px; transition: color 0.2s;
}
.staticrypt-toggle-password-visibility:hover { color: var(--jv-cyan) !important; }

/* ── Remember me ── */
.staticrypt-remember {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 22px !important;
  color: rgba(186,230,253,0.7) !important;
  font-size: 13px;
  cursor: pointer;
}
#staticrypt-remember {
  width: 16px; height: 16px;
  accent-color: var(--jv-cyan);
  cursor: pointer;
}
#staticrypt-remember-label { cursor: pointer; user-select: none; }

/* ── 버튼 (cyan→blue→purple 그라디언트) ── */
.staticrypt-decrypt-button {
  width: 100%;
  background: linear-gradient(135deg, var(--jv-cyan) 0%, var(--jv-blue) 50%, var(--jv-purple) 100%) !important;
  color: #fff !important;
  border: none !important;
  border-radius: 10px !important;
  padding: 15px 24px !important;
  font-weight: 700 !important;
  font-size: 14px !important;
  letter-spacing: 0.5px !important;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s, filter 0.2s !important;
  box-shadow:
    0 0 30px rgba(6,182,212,0.35),
    0 8px 20px -4px rgba(6,182,212,0.5),
    inset 0 1px 0 rgba(255,255,255,0.2) !important;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  position: relative;
  overflow: hidden;
}
.staticrypt-decrypt-button:hover {
  transform: translateY(-1px);
  box-shadow:
    0 0 45px rgba(6,182,212,0.55),
    0 12px 28px -4px rgba(6,182,212,0.65),
    inset 0 1px 0 rgba(255,255,255,0.25) !important;
  filter: brightness(1.1);
}
.staticrypt-decrypt-button:active { transform: translateY(0); }

.staticrypt-spinner-container { color: rgba(186,230,253,0.7) !important; }

/* 폰 카드 패딩 축소 */
@media (max-width: 480px) {
  .staticrypt-form { padding: 36px 26px !important; }
  .staticrypt-title { font-size: 22px !important; }
}

/* ─────────────────────────────────────────────────────────────
   ★ PC 전용 무거운 효과 (마우스 있는 기기만)
   폰/태블릿 터치는 자동 fallback (위 베이스 스타일만 적용)
   ───────────────────────────────────────────────────────────── */
@media (hover: hover) and (pointer: fine) {
  /* 우주 배경: nebula */
  .staticrypt-body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 700px 500px at 25% 20%, rgba(6,182,212,0.18), transparent 60%),
      radial-gradient(ellipse 600px 800px at 75% 80%, rgba(124,58,237,0.16), transparent 60%),

    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;

      radial-gradient(1.5px 1.5px at 8% 12%, #fff, transparent 60%),

      radial-gradient(2px 2px at 47% 18%, rgba(167,243,253,0.9), transparent 60%),

      radial-gradient(1px 1px at 89% 88%, rgba(167,139,250,0.9), transparent),
      radial-gradient(2px 2px at 12% 78%, #fff, transparent 60%),

      radial-gradient(1.2px 1.2px at 95% 15%, rgba(255,255,255,0.7), transparent 60%),

      radial-gradient(2.5px 2.5px at 38% 38%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1px 1px at 67% 22%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 19% 65%, rgba(244,114,182,0.7), transparent 60%);
    animation: jv-twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes jv-twinkle {
    0%   { opacity: 0.55; }
    100% { opacity: 0.95; }
  }
  /* HUD 그리드 (헬로그래픽) */
  .staticrypt-page::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(6,182,212,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(6,182,212,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
            mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  }
  /* 카드 글래스 (blur 40px + 진입 애니메이션 + 외곽 글로우 강화) */
  .staticrypt-form {
    background: rgba(8, 12, 22, 0.72) !important;
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    box-shadow:
      0 0 0 1px rgba(6,182,212,0.15),
      0 0 60px rgba(6,182,212,0.20),

      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 0 40px rgba(6,182,212,0.04) !important;
    animation: jv-fade-in 0.7s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes jv-fade-in {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* 카드 코너에 cyan 글로우 추가 */

    filter: drop-shadow(0 0 6px rgba(6,182,212,0.6));
  }
  .staticrypt-form::after {
    filter: drop-shadow(0 0 6px rgba(6,182,212,0.6));
  }
  /* 스캔 라인 — form 안 위→아래 무한 */

    position: absolute; left: 0; right: 0;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg,

                rgba(6,182,212,0.95) 50%,
                transparent 82%, transparent 100%);
    pointer-events: none;
    z-index: 1;
    box-shadow: 0 0 6px rgba(6,182,212,0.55);
    animation: jv-scan-full 2.5s linear infinite;
  }

    0%   { top: 0;    opacity: 0; }

    95%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

/* 폰에선 .jv-scanner 자체를 안 보이게 (PC @media 안에서만 정의됨이라 자동 비활성) */
.jv-scanner { display: none; }
@media (hover: hover) and (pointer: fine) {
  .jv-scanner { display: block; }
}

<script id="jarvis-login-bg-script">
(function(){
  // 다크 배경 보장 — DOMContentLoaded 한 번만 (setTimeout 무한 강제 X — 폰 메인스레드 부담)
  function fixBg(){
    try {
      var d = document.documentElement, b = document.body;
      d.style.setProperty('background', '#03060f', 'important');
      d.style.setProperty('background-color', '#03060f', 'important');
      if (b) {
        b.style.setProperty('background', '#03060f', 'important');
        b.style.setProperty('background-color', '#03060f', 'important');
      }
    } catch(e){}
  }
  fixBg();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fixBg);
  }
})();
</script>
