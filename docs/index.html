<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>AI 투자 비서 — 대시보드</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
         max-width: 720px; margin: 40px auto; padding: 24px; background: #f8f9fa; color: #1a1a1a; }
  .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { line-height: 1.6; color: #495057; }
  code { background: #f1f3f5; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>📊 AI 투자 비서 — 대시보드</h1>
  <p>봇이 처음 실행되면 이 페이지가 자동으로 갱신됩니다.</p>
  <p>다음 봇 실행 (예: 평일 06:00 미국 마감 / 08:50 장 시작 전 / 09:10 자동매수) 후 새로고침하면 최신 정보가 표시됩니다.</p>
  <p style="color:#868e96; font-size: 13px; margin-top: 24px;">
    이 페이지는 1분마다 자동 새로고침됩니다.
  </p>
</div>
</body>
</html>
