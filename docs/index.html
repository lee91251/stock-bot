<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>대시보드</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         max-width: 480px; margin: 80px auto; padding: 24px; background: #f5f6f8; color: #1a1a1a; text-align: center; }
  .card { background: white; border-radius: 16px; padding: 36px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  h1 { font-size: 18px; margin: 0 0 16px; font-weight: 600; }
  p { line-height: 1.7; color: #495057; font-size: 14px; margin: 8px 0; }
  .lock { font-size: 36px; margin-bottom: 16px; }
  small { color: #868e96; font-size: 12px; display: block; margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <h1>비공개 대시보드</h1>
  <p>이 페이지는 비밀번호로 보호됩니다.</p>
  <p>곧 비밀번호 입력 화면으로 전환됩니다.</p>
  <small>접근 권한이 있다면 관리자에게 문의하세요.</small>
</div>
</body>
</html>
