            .staticrypt-hr {

                width: 360px;

                background: inherit;
                border: 0;

                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */

            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #76B852;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

                font-size: 1.5em;

                height: 100%;

                display: inline-block;

                border-radius: 50%;

                animation-duration: 0.75s;
                animation-timing-function: linear;

                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;

/* ── 3. HUD 그리드 (헬로그래픽) ── */
.staticrypt-page {

  background: transparent !important;
}

          mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);

/* ── 4. 카드: 다크 글래스 + cyan 보더 ── */
.staticrypt-form {
  position: relative;
  width: 100%; max-width: 420px;
  background: rgba(8, 12, 22, 0.72) !important;
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(6,182,212,0.30) !important;
  border-radius: 18px !important;
  padding: 44px 40px !important;
  box-shadow:
    0 0 0 1px rgba(6,182,212,0.15),
    0 0 60px rgba(6,182,212,0.20),

    inset 0 1px 0 rgba(255,255,255,0.08),

  overflow: hidden;
}
@keyframes jv-fade-in {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* 카드 모서리 cyan 코너 액센트 — 좌상단 ㄱ + 우하단 ㄴ (대칭) */
.staticrypt-form::before {
  content: ""; position: absolute; top: 12px; left: 12px;
  width: 28px; height: 28px;
  border-top: 2px solid var(--jv-cyan);
  border-left: 2px solid var(--jv-cyan);
  opacity: 0.85;
  filter: drop-shadow(0 0 6px rgba(6,182,212,0.6));
  pointer-events: none;
}
.staticrypt-form::after {
  content: ""; position: absolute; bottom: 12px; right: 12px;
  width: 28px; height: 28px;
  border-bottom: 2px solid var(--jv-cyan);
  border-right: 2px solid var(--jv-cyan);
  opacity: 0.85;
  filter: drop-shadow(0 0 6px rgba(6,182,212,0.6));
  pointer-events: none;
}
/* 스캔 라인 애니메이션 — staticrypt-content 안쪽에 배치 */
#staticrypt_content {
  position: relative;
}
#staticrypt_content::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(6,182,212,0.55), transparent);
  animation: jv-scan 4s ease-in-out infinite;
  pointer-events: none;
  z-index: 2;
}
@keyframes jv-scan {
  0%, 100% { transform: translateY(0); opacity: 0; }
  10%      { opacity: 1; }
  50%      { transform: translateY(380px); opacity: 1; }
  60%      { opacity: 0; }
}

.staticrypt-title {
  color: #fff !important;

}

.staticrypt-hr {

.staticrypt-password-container { position: relative; margin-bottom: 18px !important; }

}
#staticrypt-password:focus {

/* staticrypt 동작 안 막음 — display 클래스 보존 */
.hidden { display: none !important; }
#staticrypt-form, #staticrypt_content { pointer-events: auto !important; }
/* focus 스타일은 위쪽 input 정의에서 처리 */
.staticrypt-toggle-password-visibility {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: transparent !important; border: none; cursor: pointer;
  color: rgba(186,230,253,0.5) !important;
  padding: 6px; transition: color 0.2s;
}
.staticrypt-toggle-password-visibility:hover { color: var(--jv-cyan) !important; }

/* ── 7. Remember me ── */
.staticrypt-remember {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 22px !important;
  color: rgba(186,230,253,0.7) !important;
  font-size: 13px;
  cursor: pointer;
}

  width: 16px; height: 16px;

    parse: function (hexString) {

     * @returns {string}
